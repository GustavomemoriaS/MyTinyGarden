apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.gardenquest.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.gardenquest.game"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
}
